<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soner Özhan | IT Uzmanı & Web Geliştirici</title>
    <!-- Font Awesome ikonları için -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --accent-hover: #0ea5e9;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --h1-color: #FFFFFF;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 700px;
            width: 100%;
            text-align: center;
            background-color: var(--bg-color);
            padding: 50px 20px;
            border-radius: 20px;
        }

        /* Profil / Hero Alanı */
        .profile-header {
            margin-bottom: 40px;
        }

        .profile-avatar {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid var(--accent-color);
            margin: 0 auto 25px;
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.4);
        }

        .profile-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-header h1 {
            font-size: 3rem;
            margin-bottom: 8px;
            color: var(--h1-color);
            font-weight: 700;
        }

        .profile-header p {
            color: var(--text-muted);
            font-size: 1.5rem;
            margin-bottom: 30px;
        }

        /* Hızlı Destek Butonu */
        .support-btn-container {
            margin-top: 40px;
        }

        .btn-support {
            display: inline-flex;
            align-items: center;
            gap: 15px;
            background-color: #128c7e; /* WhatsApp Yeşili */
            color: white;
            padding: 18px 40px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.4rem;
            transition: background 0.3s, transform 0.2s;
            box-shadow: 0 10px 25px rgba(18, 140, 126, 0.4);
            border: 2px solid #128c7e;
        }

        .btn-support:hover {
            background-color: #075e54;
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(18, 140, 126, 0.6);
        }

        .btn-support i {
            font-size: 1.8rem;
        }

        /* Küçük Logo (Alt Köşe) */
        .logo-corner {
            position: fixed;
            bottom: 15px;
            right: 15px;
            color: #64748b;
            font-size: 1rem;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- Profil Başlığı -->
        <header class="profile-header">
            <div class="profile-avatar">
                <!-- Fotoğrafın adını profil.jpg yaparsan doğrudan buraya oturacaktır -->
                <img src="profil.jpg" alt="Soner Özhan">
            </div>
            <h1>Soner Özhan</h1>
            <p>IT Uzmanı & Web Geliştirici</p>
        </header>

        <!-- Hızlı Destek Butonu (05316655279) -->
        <div class="support-btn-container">
            <a href="https://wa.me/905316655279?text=Merhaba,%20destek%20almak%20istiyorum." class="btn-support" target="_blank">
                <i class="fab fa-whatsapp"></i> Hemen Destek Al (0531 665 52 79)
            </a>
        </div>

    </div>

    <!-- Alt Bilgi Logosu -->
    <div class="logo-corner">
        Soner Özhan Digital
    </div>

</body>
</html>
